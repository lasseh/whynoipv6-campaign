# Assigns a uuid to every campaign file that reached master without one, and
# commits it back. The repo owns campaign identity: the importer keys campaigns
# on the uuid in the file, so it has to be minted here rather than invented by
# a contributor (validate.yml rejects that) or by the database.
#
# Pushes made with GITHUB_TOKEN do not start further workflow runs, so this
# cannot loop; the [skip ci] marker keeps that true if the token is ever
# swapped for a personal one.
name: assign-uuid

on:
  push:
    branches: [master]
    paths:
      - '*.yml'
      - '*.yaml'

permissions:
  contents: write

# Two merges in quick succession queue instead of racing over the same push.
concurrency:
  group: assign-uuid
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: assign missing uuids
        run: make fix-uuids

      - name: verify every campaign file has a unique, well-formed uuid
        run: make check-uuids

      - name: commit
        run: |
          if git diff --quiet; then
            echo "no uuids to assign"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u # fix-uuids only ever rewrites tracked campaign files
          git commit -m 'chore: assign campaign uuids [skip ci]'
          git push || { git pull --rebase && git push; }
